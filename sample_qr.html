<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>샘플 QR 코드 - " 이것입니다."</title>
  <!-- QRCode.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-main: #0a0f1d;
      --bg-card: #161c2e;
      --accent-mint: #0cefd3;
      --text-main: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "BAEMINWORK", "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      border: 1px solid #263147;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-width: 360px;
      width: 100%;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent-mint);
      text-align: center;
    }

    /* Standard White Quiet Zone Card matching photo layout */
    .qr-box {
      background: #ffffff;
      padding: 36px 32px 24px 32px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 0 30px rgba(12, 239, 211, 0.3);
      width: 100%;
    }

    #qrcode img, #qrcode canvas {
      width: 240px !important;
      height: 240px !important;
      image-rendering: pixelated;
    }

    .qr-caption {
      font-size: 1.1rem;
      font-weight: 800;
      color: #111827;
      letter-spacing: 1px;
      font-family: monospace, sans-serif;
    }

    .desc {
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🛵 수신기 전용 테스트 샘플 QR</h1>
    
    <div class="qr-box">
      <div id="qrcode"></div>
      <div class="qr-caption">RG TEST | 1 / 1</div>
    </div>

    <div class="desc">
      스마트폰에서 <strong style="color: var(--accent-mint);">receiver.html</strong>을 켜고 위 QR 코드를 비추시면 <strong>" 이것입니다."</strong> 라는 문구가 인식 및 복원됩니다!
    </div>
  </div>

  <script>
    function toUTF8(str) {
      return unescape(encodeURIComponent(str));
    }

    // Exact Receiver payload specification: RG:TEST:0:1: 이것입니다.
    const rawPayload = "RG:TEST:0:1: 이것입니다.";
    const safePayload = toUTF8(rawPayload);

    new QRCode(document.getElementById("qrcode"), {
      text: safePayload,
      width: 240,
      height: 240,
      correctLevel: QRCode.CorrectLevel.L
    });
  </script>
</body>
</html>
