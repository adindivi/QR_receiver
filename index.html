<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>배민 텍스트 배달 수신기 - 분할 QR 수신기</title>
  <!-- jsQR Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    :root {
      --bg-main: #0a0f1d;
      --bg-card: #161c2e;
      --bg-card-hover: #1f273e;
      --accent-mint: #0cefd3;
      --accent-mint-glow: rgba(12, 239, 211, 0.4);
      --accent-mint-dark: #05b8a2;
      --accent-red: #ef4444;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --text-dark: #111827;
      --border-color: #263147;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "BAEMINWORK", "Pretendard", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .title-group h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.5px;
    }

    .title-group h1 span.mint {
      color: var(--accent-mint);
    }

    .session-badge {
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(12, 239, 211, 0.12);
      color: var(--accent-mint);
      border: 1px solid rgba(12, 239, 211, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Camera Section */
    .scanner-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .viewport-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #040711;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    /* Overlay Viewfinder */
    .viewfinder-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .target-box {
      width: 200px;
      height: 200px;
      position: relative;
      box-shadow: 0 0 0 4000px rgba(10, 15, 29, 0.65);
      border-radius: 16px;
      transition: all 0.3s ease;
    }

    .target-box::before, .target-box::after,
    .target-box > div::before, .target-box > div::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--accent-mint);
      border-style: solid;
      border-width: 0;
    }

    /* Corner Brackets */
    .target-box::before { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 14px; }
    .target-box::after { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 14px; }
    .target-box > div::before { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 14px; }
    .target-box > div::after { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 14px; }

    .scan-line {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-mint), transparent);
      box-shadow: 0 0 12px var(--accent-mint);
      top: 10px;
      animation: scanAnim 2s infinite ease-in-out;
    }

    @keyframes scanAnim {
      0% { top: 10px; opacity: 0.3; }
      50% { top: 186px; opacity: 1; }
      100% { top: 10px; opacity: 0.3; }
    }

    .target-box.completed {
      box-shadow: 0 0 0 4000px rgba(10, 15, 29, 0.8);
    }
    .target-box.completed .scan-line {
      display: none;
    }
    .target-box.completed::before, .target-box.completed::after,
    .target-box.completed > div::before, .target-box.completed > div::after {
      border-color: var(--accent-mint);
    }

    .camera-placeholder {
      position: absolute;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .camera-placeholder svg {
      color: var(--accent-mint);
    }

    .scanner-controls {
      width: 100%;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
    }

    /* Buttons (Baemin 2.0 Style) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      letter-spacing: -0.3px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-mint {
      background-color: var(--accent-mint);
      color: var(--text-dark);
      box-shadow: 0 4px 16px var(--accent-mint-glow);
    }
    .btn-mint:hover {
      background-color: #24fcd8;
      box-shadow: 0 6px 20px rgba(12, 239, 211, 0.5);
    }

    .btn-secondary {
      background-color: #222b40;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      background-color: #2d3852;
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.12);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background-color: var(--accent-red);
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Progress & Status Card */
    .status-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .status-percentage {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent-mint);
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #090e1b;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0cefd3, #2563eb);
      border-radius: 6px;
      transition: width 0.3s ease;
      box-shadow: 0 0 12px var(--accent-mint-glow);
    }

    /* Puzzle Grid Dots Visualizer */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      gap: 8px;
      max-height: 140px;
      overflow-y: auto;
      padding: 4px;
    }

    .chunk-dot {
      height: 38px;
      border-radius: var(--radius-sm);
      background: #0a0f1d;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .chunk-dot.received {
      background: var(--accent-mint);
      border-color: var(--accent-mint);
      color: var(--text-dark);
      box-shadow: 0 0 12px var(--accent-mint-glow);
      animation: popDot 0.3s ease;
    }

    @keyframes popDot {
      0% { transform: scale(0.6); }
      50% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    /* Result Card */
    .result-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-header h2 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .text-area-wrapper {
      position: relative;
      width: 100%;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      background: #0a0f1d;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      padding: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      font-family: monospace, monospace;
    }

    textarea:focus {
      border-color: var(--accent-mint);
      box-shadow: 0 0 10px rgba(12, 239, 211, 0.2);
    }

    .action-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-group .btn {
      flex: 1;
      min-width: 130px;
    }

    /* Notice Banner */
    .notice-banner {
      background: rgba(12, 239, 211, 0.08);
      border: 1px solid rgba(12, 239, 211, 0.2);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 0.82rem;
      color: var(--accent-mint);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .completed-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(12, 239, 211, 0.15);
      color: var(--accent-mint);
      border: 1px solid var(--accent-mint);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0f1d;
    }
    ::-webkit-scrollbar-thumb {
      background: #263147;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="title-group">
        <h1>🛵 배민 <span class="mint">텍스트 배달</span> 수신기</h1>
      </div>
      <div id="sessionBadge" class="session-badge" style="display: none;">
        세션: <span id="sessionIdText">-</span>
      </div>
    </header>

    <!-- HTTPS Warning Notice -->
    <div class="notice-banner" id="httpNotice">
      <span>ℹ️ 모바일 카메라 스캔은 <strong>HTTPS</strong> 또는 <strong>localhost</strong> 환경에서만 안전하게 배달됩니다.</span>
    </div>

    <!-- Scanner Viewport Card -->
    <div class="scanner-card">
      <div class="viewport-container">
        <video id="videoElement" playsinline muted webkit-playsinline></video>
        <canvas id="canvasElement"></canvas>

        <div class="camera-placeholder" id="cameraPlaceholder">
          <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/>
          </svg>
          <span>'스캔 시작하기' 버튼을 눌러 QR 조각을 받아보세요</span>
        </div>

        <div class="viewfinder-overlay" id="viewfinder" style="display: none;">
          <div class="target-box" id="targetBox">
            <div></div>
            <div class="scan-line"></div>
          </div>
        </div>
      </div>

      <div class="scanner-controls">
        <button id="toggleCameraBtn" class="btn btn-mint">
          📷 스캔 시작하기
        </button>
        <button id="resetBtn" class="btn btn-danger">
          🔄 다시 받기
        </button>
      </div>
    </div>

    <!-- Progress & Status Card -->
    <div class="status-card">
      <div class="status-header">
        <span class="status-text" id="statusMsg">카메라 준비 완료</span>
        <span class="status-percentage" id="statusPercent">0%</span>
      </div>

      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>

      <!-- Puzzle Grid Dots -->
      <div class="grid-container" id="gridContainer">
        <!-- Chunks indicators will be rendered here dynamically -->
      </div>
    </div>

    <!-- Result Card -->
    <div class="result-card">
      <div class="result-header">
        <h2>📄 배달 완료 원본 텍스트</h2>
        <div id="completedBadge" class="completed-badge" style="display: none;">
          ✨ 식기 전에 도착 완료!
        </div>
      </div>

      <div class="text-area-wrapper">
        <textarea id="resultTextArea" placeholder="QR 코드를 비추면 조각들이 차곡차곡 따뜻하게 모여요." readonly></textarea>
      </div>

      <div class="action-group">
        <button id="copyBtn" class="btn btn-secondary" disabled>
          📋 클립보드에 담기
        </button>
        <button id="downloadBtn" class="btn btn-mint" disabled>
          💾 .txt 파일로 저장하기
        </button>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const resetBtn = document.getElementById('resetBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const statusPercent = document.getElementById('statusPercent');
    const progressFill = document.getElementById('progressFill');
    const gridContainer = document.getElementById('gridContainer');
    const resultTextArea = document.getElementById('resultTextArea');
    const cameraPlaceholder = document.getElementById('cameraPlaceholder');
    const viewfinder = document.getElementById('viewfinder');
    const targetBox = document.getElementById('targetBox');
    const sessionBadge = document.getElementById('sessionBadge');
    const sessionIdText = document.getElementById('sessionIdText');
    const completedBadge = document.getElementById('completedBadge');

    // App State
    let stream = null;
    let isScanning = false;
    let animFrameId = null;
    let lastInvalidFormatNoticeTime = 0;

    let currentSessionId = null;
    let totalChunks = null;
    let receivedChunks = new Map(); // Map<index (number), content (string)>
    let isCompleted = false;

    // Ensure playsinline for iOS Safari
    video.setAttribute('playsinline', 'true');
    video.setAttribute('webkit-playsinline', 'true');

    // Check location protocol for notice
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      document.getElementById('httpNotice').style.borderColor = 'rgba(239, 68, 68, 0.4)';
    }

    // Toggle Camera Start / Stop
    toggleCameraBtn.addEventListener('click', () => {
      if (isScanning) {
        stopCamera();
      } else {
        startCamera();
      }
    });

    // Start Camera Stream
    async function startCamera() {
      try {
        statusMsg.textContent = "카메라를 연결하는 중...";
        
        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (err) {
          // Fallback to standard video
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
        }

        video.srcObject = stream;
        await video.play();

        isScanning = true;
        cameraPlaceholder.style.display = 'none';
        viewfinder.style.display = 'flex';
        toggleCameraBtn.innerHTML = '🛑 스캔 멈추기';
        toggleCameraBtn.className = 'btn btn-secondary';

        if (!isCompleted) {
          statusMsg.textContent = currentSessionId ? "🛵 조각 텍스트 수집 중..." : "대기 중: 첫 번째 QR 코드를 비춰주세요";
        }

        requestAnimationFrame(tick);
      } catch (err) {
        console.error("Camera access error:", err);
        let errorMsg = "카메라에 접근할 수 없습니다.";
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          errorMsg = "카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라 권한을 허용해주세요.";
        } else if (err.name === 'NotFoundError') {
          errorMsg = "사용 가능한 카메라 장치를 찾을 수 없습니다.";
        }
        statusMsg.textContent = errorMsg;
        alert(errorMsg);
      }
    }

    // Stop Camera Stream
    function stopCamera() {
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      isScanning = false;
      
      toggleCameraBtn.innerHTML = '📷 스캔 시작하기';
      toggleCameraBtn.className = 'btn btn-mint';
      cameraPlaceholder.style.display = 'flex';
      viewfinder.style.display = 'none';

      if (!isCompleted) {
        statusMsg.textContent = "카메라가 일시 정지되었습니다.";
      }
    }

    // Optimized Mobile Camera Decoding Loop
    function tick() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // Downscale high-resolution mobile camera frames to max 640px for ultra-fast jsQR processing
        const maxDimension = 640;
        let w = video.videoWidth;
        let h = video.videoHeight;
        if (w > maxDimension || h > maxDimension) {
          if (w > h) {
            h = Math.round((h * maxDimension) / w);
            w = maxDimension;
          } else {
            w = Math.round((w * maxDimension) / h);
            h = maxDimension;
          }
        }

        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(video, 0, 0, w, h);

        const imageData = ctx.getImageData(0, 0, w, h);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "attemptBoth",
        });

        if (code && code.data) {
          handleScannedData(code.data);
        }
      }

      if (isScanning) {
        animFrameId = requestAnimationFrame(tick);
      }
    }

    // Payload Parsing Logic
    // Format: RG:<SessionID>:<Index>:<TotalCount>:<Content>
    function parsePayload(rawText) {
      if (!rawText || !rawText.startsWith("RG:")) return null;

      const parts = rawText.split(":");
      if (parts.length < 5) return null;

      const sessionId = parts[1].trim();
      const index = parseInt(parts[2], 10);
      const totalCount = parseInt(parts[3], 10);
      // Rejoin remaining parts in case content itself contains colons
      const content = parts.slice(4).join(":");

      if (!sessionId || isNaN(index) || isNaN(totalCount) || totalCount <= 0 || index < 0 || index >= totalCount) {
        return null;
      }

      return { sessionId, index, totalCount, content };
    }

    // Handle Scanned QR Data
    function handleScannedData(rawText) {
      if (isCompleted) return;

      const parsed = parsePayload(rawText);
      if (!parsed) {
        // Show feedback if a non-RG format QR code is detected
        const now = Date.now();
        if (now - lastInvalidFormatNoticeTime > 2500) {
          lastInvalidFormatNoticeTime = now;
          const snippet = rawText.length > 25 ? rawText.substring(0, 25) + '...' : rawText;
          statusMsg.textContent = `⚠️ 규격 외 QR 스캔됨 ("${snippet}") - RG:로 시작해야 합니다`;
        }
        return;
      }

      const { sessionId, index, totalCount, content } = parsed;

      // Lock session to first valid QR session ID
      if (currentSessionId === null) {
        currentSessionId = sessionId;
        totalChunks = totalCount;
        
        sessionBadge.style.display = 'inline-flex';
        sessionIdText.textContent = sessionId;
        
        initGrid(totalCount);
      } else if (sessionId !== currentSessionId) {
        // Ignore QR codes from a different session
        statusMsg.textContent = `⚠️ 현재 세션(${currentSessionId})과 다른 세션의 QR입니다.`;
        return;
      }

      // Check if new chunk
      if (!receivedChunks.has(index)) {
        receivedChunks.set(index, content);
        
        // Haptic feedback if supported
        if (navigator.vibrate) {
          navigator.vibrate(40);
        }

        updateProgressUI();
        updateDot(index);

        // Check if all chunks received
        if (receivedChunks.size === totalChunks) {
          onComplete();
        }
      }
    }

    // Initialize Puzzle Dots Grid
    function initGrid(count) {
      gridContainer.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const dot = document.createElement('div');
        dot.className = 'chunk-dot';
        dot.id = `dot-${i}`;
        dot.textContent = i + 1;
        gridContainer.appendChild(dot);
      }
    }

    // Update single dot state
    function updateDot(index) {
      const dot = document.getElementById(`dot-${index}`);
      if (dot) {
        dot.classList.add('received');
        dot.textContent = `✓ ${index + 1}`;
      }
    }

    // Update Progress UI
    function updateProgressUI() {
      const currentCount = receivedChunks.size;
      const percent = Math.floor((currentCount / totalChunks) * 100);

      statusPercent.textContent = `${percent}%`;
      progressFill.style.width = `${percent}%`;

      if (!isCompleted) {
        statusMsg.textContent = `🛵 조각 텍스트 배달 중! (${currentCount} / ${totalChunks} 조각 도착)`;
      }
    }

    // All Chunks Collected Completion
    function onComplete() {
      isCompleted = true;
      stopCamera();

      // Assemble full text in correct index order (0 to totalChunks - 1)
      let fullTextParts = [];
      for (let i = 0; i < totalChunks; i++) {
        fullTextParts.push(receivedChunks.get(i) || '');
      }
      const fullAssembledText = fullTextParts.join('');

      // Display result
      resultTextArea.value = fullAssembledText;
      resultTextArea.removeAttribute('readonly');

      // Enable action buttons
      copyBtn.disabled = false;
      downloadBtn.disabled = false;
      completedBadge.style.display = 'inline-flex';
      targetBox.classList.add('completed');

      statusMsg.textContent = `✨ 식기 전에 100% 도착 완료! (${totalChunks}/${totalChunks})`;
      statusPercent.textContent = "100%";
      progressFill.style.width = "100%";

      // Completion Vibration
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }
    }

    // Clipboard Copy
    copyBtn.addEventListener('click', async () => {
      const text = resultTextArea.value;
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '✓ 클립보드 담기 완료!';
        copyBtn.style.backgroundColor = 'var(--accent-mint)';
        copyBtn.style.color = 'var(--text-dark)';
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
          copyBtn.style.backgroundColor = '#222b40';
          copyBtn.style.color = 'var(--text-main)';
        }, 2000);
      } catch (err) {
        // Fallback for older browsers
        resultTextArea.select();
        document.execCommand('copy');
        alert('클립보드에 복사되었습니다.');
      }
    });

    // File Download (.txt)
    downloadBtn.addEventListener('click', () => {
      const text = resultTextArea.value;
      if (!text) return;

      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const timestamp = new Date().toISOString().slice(0,19).replace(/[^0-9]/g, "");
      a.download = `Baemin_QR_${currentSessionId || 'text'}_${timestamp}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Full Reset
    resetBtn.addEventListener('click', () => {
      if (receivedChunks.size > 0 && !confirm("현재 진행 중인 배달 상태를 정말 초기화하시겠습니까?")) {
        return;
      }

      // Reset state
      currentSessionId = null;
      totalChunks = null;
      receivedChunks.clear();
      isCompleted = false;

      // Reset UI
      sessionBadge.style.display = 'none';
      sessionIdText.textContent = '-';
      completedBadge.style.display = 'none';
      targetBox.classList.remove('completed');
      gridContainer.innerHTML = '';
      
      resultTextArea.value = '';
      resultTextArea.setAttribute('readonly', 'true');
      copyBtn.disabled = true;
      downloadBtn.disabled = true;

      statusMsg.textContent = isScanning ? "대기 중: 첫 번째 QR 코드를 비춰주세요" : "카메라 준비 완료";
      statusPercent.textContent = "0%";
      progressFill.style.width = "0%";
    });
  </script>
</body>
</html>
